<style>
    /* Prevent pull-to-refresh and ensure full height on mobile */
    html, body, #root {
      height: 100dvh;
    }
    body {
      overflow: hidden; /* This prevents pull-to-refresh and bouncing scroll */
    }
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 10px;
    }
    .dark ::-webkit-scrollbar-track {
      background: #18181b; /* zinc-900 */
    }
    html:not(.dark) ::-webkit-scrollbar-track {
      background: #f4f4f5; /* zinc-100 */
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #52525b; /* zinc-600 */
      border-radius: 5px;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
        background: #d4d4d8; /* zinc-300 */
        border-radius: 5px;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #71717a; /* zinc-500 */
    }
    html:not(.dark) ::-webkit-scrollbar-thumb:hover {
      background: #a1a1aa; /* zinc-400 */
    }

    /* Markdown Content Styling */
    .markdown-content p { margin-bottom: 0.75em; }
    .markdown-content p:last-child { margin-bottom: 0; }
    .markdown-content ul, .markdown-content ol { margin-left: 1.5em; margin-bottom: 0.75em; list-style: revert; }
    .markdown-content li { margin-bottom: 0.25em; }
    .markdown-content strong { font-weight: 600; }
    .markdown-content em { font-style: italic; }
    html:not(.dark) .markdown-content strong { color: #18181b; }
    html:not(.dark) .markdown-content em { color: #3f3f46; }
    .dark .markdown-content strong { color: #f4f4f5; }
    .dark .markdown-content em { color: #d4d4d8; }
  </style>
